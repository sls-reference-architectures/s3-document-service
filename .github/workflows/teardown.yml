name: Weekly Teardown

# The stack is left deployed between runs (the HTTP API is IAM-protected, so
# there is nothing to abuse). This job periodically removes it so the next
# push exercises a cold create rather than an update — otherwise a deploy
# that only breaks on stack creation would never surface.
#
# Deliberately teardown-only, and scheduled for a quiet hour: deleting while
# functions are still being invoked is what orphans a Lambda log group, and an
# orphaned log group blocks every later deploy with ResourceExistenceCheck.

on:
  schedule:
    - cron: '0 8 * * 0' # Sundays, 08:00 UTC (03:00 US Central)
  workflow_dispatch:

concurrency: one-at-a-time-please

permissions:
  id-token: write
  contents: read

jobs:
  Teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          action-timeout-s: 300
      - name: Tear down stack
        run: npx sls remove
